name: gymologia
description: Gymologia — gym members, owners and staff in one app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Date, number and message formatting per locale.
  intl: any
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # Tokens must not sit in plain SharedPreferences — Keychain on iOS,
  # EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^9.2.2

  # State
  provider: ^6.1.2
  flutter_cashfree_pg_sdk: ^2.4.0+52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb at build time.
  generate: true
