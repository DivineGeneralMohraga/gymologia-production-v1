name: gymologia
description: Gymologia — gym members, owners and staff in one app.
publish_to: 'none'
version: 0.3.7+25

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Date, number and message formatting per locale.
  intl: any
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # Tokens must not sit in plain SharedPreferences — Keychain on iOS,
  # EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^9.2.2

  # State
  provider: ^6.1.2
  flutter_cashfree_pg_sdk: ^2.4.0+52

  # Nearby-gym ranking in the gym browser. Optional at every layer: a
  # denial or a disabled service both fall back to the existing name/
  # district text search rather than blocking anything.
  geolocator: ^13.0.2

  # Gym photos (camera or gallery, resized on the phone before upload) and
  # KYC documents, which may be PDFs -- hence the second picker. The
  # official file_selector rather than file_picker: file_picker 11 does not
  # build on this project's Kotlin setup, and 8.x pins an old compileSdk.
  image_picker: ^1.2.3
  file_selector: ^1.1.0

  # Setting a gym's location on a map. OpenStreetMap tiles: no API key or
  # billing account. Switching to Google Maps later is a tile-layer change.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Contact button on a gym's page opens the phone dialer.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb at build time.
  generate: true
  assets:
    - assets/icon/
  # Headings, numbers and buttons (theme.dart: displayFont). SIL Open Font
  # License -- assets/fonts/OFL.txt. Body text stays on the system font so
  # every Indic script renders natively.
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
        - asset: assets/fonts/BarlowCondensed-BlackItalic.ttf
          weight: 900
          style: italic

# Run: dart run flutter_launcher_icons
# assets/icon/icon.png is the full-bleed square (also the source for
# iOS, which rounds it itself); icon_foreground.png is the same dumbbell
# alone, pre-shrunk to sit inside Android's adaptive-icon safe zone
# under any OEM mask shape. #F8D8C9 is this artwork's own cream
# background -- not the app's theme.dart seed colour.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F8D8C9"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
